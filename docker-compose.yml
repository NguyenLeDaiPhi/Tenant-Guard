services:
  postgres:
    image: postgres:16-alpine
    container_name: tenantguard-postgres
    environment:
      POSTGRES_DB: tenantguard
      POSTGRES_USER: ${POSTGRES_USER:-auth_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d tenantguard" ]
      interval: 5s
      timeout: 5s
      retries: 5

  tenant-schema-bootstrap:
    image: postgres:16-alpine
    container_name: tenantguard-tenant-schema-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: tenantguard
      PGUSER: ${POSTGRES_USER:-auth_service}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      AUTH_DB_USER: ${DB_USERNAME:-auth_service_app}
      AUTH_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD in the environment}}
      TENANT_MIGRATION_PASSWORD: ${TENANT_MIGRATION_PASSWORD:?Set TENANT_MIGRATION_PASSWORD in the environment}
      # Bump when the mounted bootstrap changes so Compose recreates the one-shot container.
      TENANT_SCHEMA_BOOTSTRAP_VERSION: "4"
    volumes:
      - ./infrastructure/docker/postgres/tenant-registry-bootstrap.sql:/tenant-registry-bootstrap.sql:ro
    command:
      - sh
      - -c
      - >-
        psql --set=ON_ERROR_STOP=1 --set=auth_user="$$AUTH_DB_USER" --set=auth_password="$$AUTH_DB_PASSWORD" --set=tenant_password="$$TENANT_DB_PASSWORD" --set=tenant_migration_password="$$TENANT_MIGRATION_PASSWORD" --file=/tenant-registry-bootstrap.sql
    restart: "no"

  # Local email testing. Not used by default.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tenantguard-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    profiles:
      - local-mail

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: tenantguard-auth-service
    ports:
      - "8081:8081"
      - "9090:9090"
    environment:
      SERVER_PORT: 8081

      DATABASE_URL: jdbc:postgresql://postgres:5432/tenantguard
      DB_USERNAME: ${DB_USERNAME:-auth_service_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}

      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:8081}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-tenantguard-api}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-tenantguard-local}
      AUTH_JWT_ACCESS_TOKEN_TTL: ${AUTH_JWT_ACCESS_TOKEN_TTL:-PT10M}
      AUTH_JWT_PRIVATE_KEY_BASE64: ${AUTH_JWT_PRIVATE_KEY_BASE64:?Set AUTH_JWT_PRIVATE_KEY_BASE64 in the environment}
      AUTH_JWT_PUBLIC_KEY_BASE64: ${AUTH_JWT_PUBLIC_KEY_BASE64:?Set AUTH_JWT_PUBLIC_KEY_BASE64 in the environment}

      # Gmail SMTP
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@tenantguard.local}

    depends_on:
      postgres:
        condition: service_healthy
      tenant-schema-bootstrap:
        condition: service_completed_successfully

  tenant-service:
    build:
      context: ./services/tenant-service
      dockerfile: Dockerfile
    container_name: tenantguard-tenant-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgres:5432/tenantguard
      TENANT_DB_USERNAME: tenant_service
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD in the environment}}
      TENANT_MIGRATION_USERNAME: tenant_service_migrator
      TENANT_MIGRATION_PASSWORD: ${TENANT_MIGRATION_PASSWORD:?Set TENANT_MIGRATION_PASSWORD in the environment}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:8081}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-tenantguard-api}
      AUTH_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@tenantguard.local}
      TENANT_INVITATION_ACCEPT_URL: ${TENANT_INVITATION_ACCEPT_URL:-http://localhost:3000/invitations/accept}
    depends_on:
      postgres:
        condition: service_healthy
      tenant-schema-bootstrap:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy

volumes:
  pgdata:
