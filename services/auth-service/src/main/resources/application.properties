spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tenantguard}
spring.datasource.username=${DB_USERNAME:auth_service}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME:auth_service}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.default-schema=auth_service
spring.flyway.schemas=auth_service
spring.flyway.table=auth_service_flyway_schema_history

auth.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:tenantguard-api}
auth.jwt.access-token-ttl=${AUTH_JWT_ACCESS_TOKEN_TTL:PT10M}
auth.jwt.key-id=${AUTH_JWT_KEY_ID:tenantguard-local}
auth.jwt.private-key-base64=${AUTH_JWT_PRIVATE_KEY_BASE64:}
auth.jwt.public-key-base64=${AUTH_JWT_PUBLIC_KEY_BASE64:}

# Email delivery
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:phiproga@gmail.com}
spring.mail.password=${MAIL_PASSWORD:fqns mpaa owux gdnm}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

auth.email.from=${MAIL_FROM:phiproga@gmail.com}
auth.email.verification-ttl=PT15M

auth.bootstrap.tenant-admin.enabled=${AUTH_BOOTSTRAP_TENANT_ADMIN_ENABLED:false}
auth.bootstrap.tenant-admin.tenant-id=${AUTH_BOOTSTRAP_TENANT_ID:}
auth.bootstrap.tenant-admin.email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
auth.bootstrap.tenant-admin.password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
