spring.application.name=tenant-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tenantguard}
spring.datasource.username=${TENANT_DB_USERNAME:tenant_service}
spring.datasource.password=${TENANT_DB_PASSWORD:}
spring.flyway.user=${TENANT_MIGRATION_USERNAME:${TENANT_DB_USERNAME:tenant_service}}
spring.flyway.password=${TENANT_MIGRATION_PASSWORD:${TENANT_DB_PASSWORD:}}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=tenant_service
spring.flyway.default-schema=tenant_service
spring.flyway.schemas=tenant_service
spring.flyway.table=tenant_service_flyway_schema_history

auth.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:8081}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:tenantguard-api}
auth.jwt.jwk-set-uri=${AUTH_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
tenant.email.from=${MAIL_FROM:no-reply@tenantguard.local}
tenant.invitation.accept-url=${TENANT_INVITATION_ACCEPT_URL:http://localhost:3000/invitations/accept}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
