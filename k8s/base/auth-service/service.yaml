apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: tenantguard-app
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: tenantguard-oms
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: management
      port: 9090
      targetPort: management
      protocol: TCP

