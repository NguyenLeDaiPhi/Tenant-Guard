apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenant-service-ingress
  namespace: tenantguard-app
  labels:
    app.kubernetes.io/name: tenant-service
    app.kubernetes.io/part-of: tenantguard-oms
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tenantguard.local
      secretName: tenantguard-tls
  rules:
    - host: tenantguard.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: tenant-service
                port:
                  name: http
