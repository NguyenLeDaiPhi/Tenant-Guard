apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-service-config
  namespace: tenantguard-app
  labels:
    app.kubernetes.io/name: tenant-service
    app.kubernetes.io/part-of: tenantguard-oms
data:
  SERVER_PORT: "8082"
  DATABASE_URL: "jdbc:postgresql://postgres.tenantguard-data.svc.cluster.local:5432/tenantguard"
  AUTH_JWT_ISSUER: "http://auth-service:8081"
  AUTH_JWT_AUDIENCE: "tenantguard-api"
  AUTH_JWT_JWK_SET_URI: "http://auth-service:8081/.well-known/jwks.json"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS: "true"
  MAIL_FROM: "no-reply@tenantguard.local"
  TENANT_INVITATION_ACCEPT_URL: "https://tenantguard.local/invitations/accept"
