name: Tenant Service CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "services/tenant-service/**"
      - "services/auth-service/src/main/java/**"
      - ".github/workflows/tenant-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/tenant-service/**"
      - "services/auth-service/src/main/java/**"
      - ".github/workflows/tenant-service-ci.yml"

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and build Tenant Service
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
          cache-dependency-path: services/tenant-service/pom.xml

      - name: Verify Maven wrapper
        run: chmod +x services/tenant-service/mvnw

      - name: Compile and run tests
        run: >
          ./services/tenant-service/mvnw
          --batch-mode
          -f services/tenant-service/pom.xml
          clean verify

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -t tenantguard/tenant-service:ci \
            services/tenant-service

  publish-image:
    name: Publish Tenant Service image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/nguyenledaiphi/tenant-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Build and publish image
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::12}"
          docker build \
            --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            services/tenant-service
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"
